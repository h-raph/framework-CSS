<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini-framework CSS</title>

    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <header class="ly-content">
        <div class="ly-container">
            <h1 class="">Framework CSS</h1>
        </div>
    </header>

    <section class="ly-content" id="button" aria-labelledby="button-titre">
        <h2 class="" id="button-titre">Grid</h2>
        <p class="">Concrètement, un système de grille à 12 colonnes est une méthode 
            de mise en page où la largeur de ton écran ou de ton conteneur est découpée
            en 12 colonnes invisibles et égales.</p>

        <div class="ly-grid space-24px">
            <button class="col-2 btn">col-2</button>
            <button class="col-8 btn">col-8</button>
            <button class="col-2 btn">col-2</button>
        </div>

        <div class="ly-grid space-24px">
            <button class="col-3 btn">col-3</button>
            <button class="col-5 btn">col-5</button>
            <button class="col-4 btn">col-4</button>
        </div>

        <div class="ly-grid space-24px">
            <button class="col-7 btn">col-7</button>
            <button class="col-5 btn">col-5</button>
        </div>

        <div class="ly-grid space-24px">
            <button class="col-1 btn">col-1</button>
            <button class="col-9 btn">col-9</button>
            <button class="col-2 btn">col-2</button>
        </div>
    </section>

</body>

</html>
