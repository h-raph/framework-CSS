<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini-framework CSS</title>

    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <header class="ly-content">
        <div class="ly-container">
            <p class="">Framework CSS</p>
            <h1 class="">Bibliothèque de composants</h1>
        </div>
    </header>

    <section class="ly-content" id="button" aria-labelledby="button-titre">
        <h2 class="" id="button-titre">Boutons</h2>
        <p class="">Un composant de base, des variantes de couleur et de taille, une icône
            facultative et des états.</p>

        <div class="ly-grid space-24px">
            <p class="col-2">Bouton de base</p>
            <button class="col-8">Réserver</button>
        </div>

        <div class="ly-grid space-24px">
            <p class="col-2">Couleurs</p>
            <button class="col-2">Principal</button>
            <button class="col-2">Secondaire</button>
            <button class="col-2">Contour</button>
            <button class="col-2">Clair</button>
        </div>

        <div class="ly-grid space-24px">
            <p class="col-2">Tailles</p>
            <button class="col-3">Petit</button>
            <button class="col-3">Moyen</button>
            <button class="col-3">Grand</button>
        </div>

        <div class="ly-grid space-24px">
            <p class="col-2">Avec icône</p>
            <button class="col-2"><span class="">Ajouter au progamme</span></button>
            <button class="col-2"><span class="">Réserver</span></button>
            <button class="col-2"><span class="">♡</span></button>
            <button class="col-2"><span class="">Suivant</span></button>
        </div>

        <div class="ly-grid space-24px">
            <p class="col-2">Combinaisons et états</p>
            <button class="col-2">Secondaire grand</button>
            <button class="col-2">Survol</button>
            <button class="col-2">Focus clavier</button>
            <button class="col-2">Désactivé</button>
            <button class="col-2">⭕️</button>
        </div>
    </section>

</body>

</html>
